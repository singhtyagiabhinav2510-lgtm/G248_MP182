
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp182-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mp182-api
  template:
    metadata:
      labels:
        app: mp182-api
    spec:
      containers:
        - name: mp182-api
          image: mp182-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
